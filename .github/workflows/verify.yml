name: Verify modules
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: jq --version
      - run: npm test
      - name: Check published files match the source
        run: git diff --exit-code -- modules scripts/bilibili scripts/chronos scripts/x
